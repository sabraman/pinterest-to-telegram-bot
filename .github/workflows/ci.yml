name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Check for leaked deployment secrets
        run: |
          if grep -R -n -E '8421055017|AAEh2sMG2YivD0l4Mdn1uVXStUtE_MVpdc8|xfM00Y1QN4m7|WeEXT8kmPULE|u5cqisL5' \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=data \
            .; then
            echo "Known deployment secret fragment found in repository files."
            exit 1
          fi

      - name: Build Docker image
        run: docker compose build
