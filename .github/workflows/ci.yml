name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Check for leaked deployment secrets
        run: |
          BOT_TOKEN_PATTERN='TELEGRAM_BOT_TOKEN=[0-9]+:[A-Za-z0-9_-]{20,}'
          PASSWORD_PATTERN='(VPS_ROOT_PASSWORD[[:space:]]*=|Пароль[[:space:]]*:)'
          if grep -R -n -E "$BOT_TOKEN_PATTERN|$PASSWORD_PATTERN" \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=data \
            .; then
            echo "Known deployment secret fragment found in repository files."
            exit 1
          fi

      - name: Build Docker image
        run: docker compose build
