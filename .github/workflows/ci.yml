name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test

      - name: Check for leaked deployment secrets
        run: |
          BOT_TOKEN_PATTERN='TELEGRAM_BOT_TOKEN=[0-9]+:[A-Za-z0-9_-]{20,}'
          PASSWORD_PATTERN='(VPS_ROOT_PASSWORD[[:space:]]*=|Пароль[[:space:]]*:)'
          if grep -R -n -E "$BOT_TOKEN_PATTERN|$PASSWORD_PATTERN" \
            --exclude-dir=.git \
            --exclude-dir=data \
            --exclude-dir=target \
            .; then
            echo "Known deployment secret fragment found in repository files."
            exit 1
          fi

      - name: Build Docker image
        run: docker compose build
