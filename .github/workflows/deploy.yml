name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      APP_DIR: /opt/pinterest-to-telegram-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        run: |
          test -n "${{ secrets.VPS_HOST }}"
          test -n "${{ secrets.VPS_USER }}"
          test -n "${{ secrets.VPS_SSH_KEY }}"
          test -n "${{ secrets.PRODUCTION_ENV }}"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Ensure application directory
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            set -e
            mkdir -p '$APP_DIR'
            if ! command -v rsync >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y rsync
            fi
          "

      - name: Sync application files
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'data' \
            --exclude '.env' \
            --exclude '*.sqlite' \
            --exclude '*.sqlite-shm' \
            --exclude '*.sqlite-wal' \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:$APP_DIR/"

      - name: Write production environment
        run: |
          printf '%s\n' "${{ secrets.PRODUCTION_ENV }}" > /tmp/pinterest-bot.env
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" /tmp/pinterest-bot.env "$VPS_USER@$VPS_HOST:$APP_DIR/.env"
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "chmod 600 '$APP_DIR/.env'"

      - name: Build and restart container
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            set -e
            cd '$APP_DIR'
            docker compose up -d --build
            docker image prune -f
            docker compose ps
          "
